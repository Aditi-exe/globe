# Phase 0 placeholder CI: verify the project configures and builds on Windows.
# Expand later (artifacts, releases, macOS/Linux) per PLAN.md §14.
name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (GLAD needs it)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # GLAD's generator is a Python program that needs Jinja2. The local dev
      # machine happened to have it; the clean CI Python does not, so install it.
      - name: Install GLAD's Python dependency
        run: python -m pip install --upgrade pip jinja2

      # Don't pin a VS version here: the hosted runner image changes over time
      # (windows-latest no longer guarantees "Visual Studio 17 2022"). Letting
      # CMake auto-detect the installed Visual Studio generator keeps CI working
      # across image bumps. Locally you can still pass -G explicitly.
      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Debug
